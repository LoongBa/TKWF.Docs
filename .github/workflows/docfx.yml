name: Build and Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Checkout source (private repo)
        uses: actions/checkout@v4
        with:
          repository: LoongBa/TKW.Framework
          token: ${{ secrets.TOKEN_FRAMEWORK }}
          path: src/TKW.Framework
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build source (for XML doc)
        run: dotnet build src/TKW.Framework/TKW.Framework.slnx -c Release -v minimal
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Sync version numbers
        run: pwsh docs/prebuild.ps1 -TKWFSourceRoot src/TKW.Framework

      - name: Verify prebuild produced no version drift (SC-01 — prebuild must be idempotent; a diff means version sync was missed before commit)
        run: git diff --exit-code -- docs/llms.txt docs/index.md docs/articles/agentic/source-doc-map.md

      - name: Self-check L1 gate
        run: pwsh scripts/self-check.ps1

      - name: Information architecture gate
        run: pwsh scripts/check-ia.ps1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Build SPA (webui)
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        working-directory: webui

      - name: Build docs (fail on doc warning — SC-06; NuGet advisory NU19xx excluded as framework-side)
        working-directory: ./
        run: |
          docfx docs/docfx.json 2>&1 | tee docfx-build.log
          hits=$(grep -iE 'warning' docfx-build.log | grep -viE 'NU19[0-9]{2}|Msbuild failed when processing|Found project reference without a matching metadata reference|[0-9]+ warning\(s\)' || true)
          if [ -n "$hits" ]; then
            echo "$hits" | head -30
            echo "::error::docfx build 存在文档告警（SC-06）"
            exit 1
          fi

      - name: API coverage gate (SC-16 — guards metadata glob drift that silently empties /api)
        run: |
          n=$(find docs/_site/api -type f 2>/dev/null | wc -l)
          echo "API files: $n (baseline ~845)"
          if [ "$n" -lt 700 ]; then
            echo "::error::API 产物仅 $n 个，疑似 metadata glob 与框架顶层目录失配（线上 /api 将 404）"
            exit 1
          fi

      - name: Merge SPA into _site
        run: |
          # SPA index.html 接管首页；404.html 兜底 /nuget 等 SPA 路由的直链访问
          cp -r webui/dist/* docs/_site/
          cp webui/dist/index.html docs/_site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
