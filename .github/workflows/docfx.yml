name: Build and Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Checkout source (private repo)
        uses: actions/checkout@v4
        with:
          repository: LoongBa/TKW.Framework
          token: ${{ secrets.TOKEN_FRAMEWORK }}
          path: src/TKW.Framework

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build source (for XML doc)
        run: dotnet build src/TKW.Framework/TKW.Framework.sln -c Release -v minimal
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Build docs
        run: docfx docs/docfx.json
        working-directory: ./

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
